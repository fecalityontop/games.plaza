    <script>
    (function () {
      var frame = document.getElementById('game-frame');
      var canvas = document.getElementById('canvas');
      function fit() {
        var aw = window.innerWidth || 1280;
        var ah = window.innerHeight || 720;
        var fw = Math.max(1, Math.floor(Math.min(aw, ah * 4 / 3)));
        var fh = Math.max(1, Math.floor(fw * 3 / 4));
        frame.style.width = fw + 'px';
        frame.style.height = fh + 'px';
        var cw = canvas.width || 640;
        var ch = canvas.height || 480;
        var scale = Math.min(fw / cw, fh / ch);
        var w = Math.max(1, Math.floor(cw * scale));
        var h = Math.max(1, Math.floor(ch * scale));
        var ws = w + 'px', hs = h + 'px';
        if (canvas.style.width !== ws || canvas.style.height !== hs) {
          canvas.style.width = ws;
          canvas.style.height = hs;
