<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ULTRAKILL WEB PORT</title>
    <style>
      html, body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #231F20;
        display: block;
      }

      #fullscreen-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        padding: 8px 12px;
        font-family: sans-serif;
        font-size: 12px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        cursor: pointer;
      }

      #fullscreen-btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      :fullscreen #fullscreen-btn {
        display: none;
      }
    </style>
  </head>
  <body>
    <button id="fullscreen-btn" type="button" title="Toggle Fullscreen">Fullscreen</button>
    <canvas id="unity-canvas" width="1280" height="720"></canvas>
    <script src="Build/ULTRAWEB 1.7a.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const fsBtn = document.querySelector("#fullscreen-btn");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch((err) => {
            console.warn("Fullscreen request failed:", err);
          });
        } else if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }

      fsBtn.addEventListener("click", toggleFullscreen);

      createUnityInstance(canvas, {
        dataUrl: "Build/ULTRAWEB 1.7a.data.unityweb",
        frameworkUrl: "Build/ULTRAWEB 1.7a.framework.js.unityweb",
        codeUrl: "Build/ULTRAWEB 1.7a.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hakita and Cake Logic",
        productName: "ULTRAKILL WEB PORT",
        productVersion: "1.4",
        matchWebGLToCanvasSize: true,
      });
    </script>
  </body>
</html>
