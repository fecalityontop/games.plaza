name = "g"
compatibility_date = "2026-01-01"
main = "./worker.js"

[assets]
directory = "./"           # Or "./dist" depending on where your build output goes
binding = "ASSETS"        # This explicitly tells Cloudflare to create the env.ASSETS binding
# Run worker.js first for EVERY request. Without this, existing static files are
# served directly and skip the COOP/COEP headers GTA IV (and Eagler) need for
# SharedArrayBuffer/WebAssembly threads. worker.js calls env.ASSETS.fetch itself.
run_worker_first = ["/*"]